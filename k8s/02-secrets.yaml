# NOTE: base64 is NOT encryption - this file is committed only to show the
# expected shape. In a real environment these values would come from
# a secrets manager (AWS Secrets Manager / Vault / Sealed Secrets) and
# never be checked into git. Values below decode to placeholder
# credentials matching docker-compose, for local demo parity only.
