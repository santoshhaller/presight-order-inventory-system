apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: presight
spec:
  replicas: 1   # Eureka peer-awareness across replicas is out of scope for this assessment;
                # a single registry is an acceptable single point of failure for a take-home demo,
                # noted explicitly in README "Production Considerations".
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: santoshhaller/discovery-server:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_HOSTNAME
              value: discovery-server
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: presight
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
