# Local, single-host simulation of the full system. Not a substitute for the
# Kubernetes manifests in k8s/ - this is here so a reviewer can run
# `docker compose up --build` and hit the gateway on localhost:8080
# without needing a cluster.
version: "3.8"

services:

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
    ports:
      - "3307:3306"
    volumes:
      - order_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presight-net

  mysql-inventory:
    image: mysql:8.0
    container_name: mysql-inventory
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
    ports:
      - "3308:3306"
    volumes:
      - inventory_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presight-net

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - presight-net

  inventory-service:
    build: ./inventory-service
    restart: unless-stopped
    depends_on:
      mysql-inventory:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_pass
      LOW_STOCK_THRESHOLD: "10"
    ports:
      - "8082"
    networks:
      - presight-net

  order-service:
    build: ./order-service
    restart: unless-stopped
    depends_on:
      mysql-order:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: order_user
      DB_PASSWORD: order_pass
    ports:
      - "8081"
    networks:
      - presight-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - discovery-server
      - order-service
      - inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - presight-net

networks:
  presight-net:
    driver: bridge

volumes:
  order_db_data:
  inventory_db_data:
