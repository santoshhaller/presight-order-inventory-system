<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1300" height="900" fill="#f8fafc"/>

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Order &amp; Inventory Microservices - Deployment Architecture</text>

  <!-- Clients -->
  <rect x="560" y="70" width="180" height="50" rx="8" fill="#111827"/>
  <text x="650" y="101" text-anchor="middle" font-size="14" fill="#fff">Client Apps</text>
  <line x1="650" y1="120" x2="650" y2="280" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- K8s cluster boundary -->
  <rect x="60" y="240" width="1180" height="600" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="80" y="265" font-size="13" fill="#64748b" font-weight="600">Kubernetes Cluster - namespace: presight</text>

  <!-- API Gateway -->
  <rect x="510" y="280" width="280" height="60" rx="8" fill="#2563eb"/>
  <text x="650" y="305" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">API Gateway</text>
  <text x="650" y="323" text-anchor="middle" font-size="11" fill="#dbeafe">Spring Cloud Gateway · 2-6 replicas (HPA)</text>

  <line x1="600" y1="340" x2="320" y2="410" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="340" x2="980" y2="410" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Order service -->
  <rect x="150" y="410" width="300" height="70" rx="8" fill="#16a34a"/>
  <text x="300" y="435" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Order Service</text>
  <text x="300" y="452" text-anchor="middle" font-size="11" fill="#dcfce7">create / query / update orders</text>
  <text x="300" y="468" text-anchor="middle" font-size="11" fill="#dcfce7">3-10 replicas (HPA) · Feign + Resilience4j</text>

  <!-- Inventory service -->
  <rect x="850" y="410" width="300" height="70" rx="8" fill="#d97706"/>
  <text x="1000" y="435" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Inventory Service</text>
  <text x="1000" y="452" text-anchor="middle" font-size="11" fill="#ffedd5">stock deduction · low-stock warnings</text>
  <text x="1000" y="468" text-anchor="middle" font-size="11" fill="#ffedd5">3-10 replicas (HPA) · pessimistic locking</text>

  <!-- REST between order and inventory -->
  <line x1="450" y1="430" x2="850" y2="430" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="650" y="418" text-anchor="middle" font-size="11" fill="#111827">REST: reserve / release (sync, circuit-breaker)</text>

  <!-- Eureka -->
  <rect x="565" y="500" width="170" height="55" rx="8" fill="#7c3aed"/>
  <text x="650" y="524" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Discovery Server</text>
  <text x="650" y="540" text-anchor="middle" font-size="10" fill="#ede9fe">Eureka (service registry)</text>
  <line x1="565" y1="527" x2="450" y2="470" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="735" y1="527" x2="850" y2="470" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="650" y1="500" x2="650" y2="340" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="770" y="510" font-size="10" fill="#7c3aed">register / discover</text>

  <!-- ConfigMap -->
  <rect x="900" y="570" width="220" height="55" rx="8" fill="#ea580c"/>
  <text x="1010" y="593" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">ConfigMap</text>
  <text x="1010" y="610" text-anchor="middle" font-size="10" fill="#ffedd5">inventory-threshold-config</text>
  <line x1="1010" y1="570" x2="1000" y2="480" stroke="#ea580c" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="1090" y="555" font-size="10" fill="#ea580c">watch &amp; refresh</text>

  <!-- Databases -->
  <rect x="150" y="620" width="300" height="70" rx="8" fill="#334155"/>
  <text x="300" y="648" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">MySQL - order_db</text>
  <text x="300" y="665" text-anchor="middle" font-size="10" fill="#cbd5e1">StatefulSet + PVC</text>
  <line x1="300" y1="480" x2="300" y2="620" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="620" width="300" height="70" rx="8" fill="#334155"/>
  <text x="1000" y="648" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">MySQL - inventory_db</text>
  <text x="1000" y="665" text-anchor="middle" font-size="10" fill="#cbd5e1">StatefulSet + PVC</text>
  <line x1="1000" y1="480" x2="1000" y2="620" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend / notes -->
  <rect x="100" y="730" width="1040" height="90" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="120" y="753" font-size="12" fill="#1e293b" font-weight="700">High availability &amp; scalability notes:</text>
  <text x="120" y="772" font-size="11" fill="#334155">• Every stateless service runs 2+ replicas behind a K8s Service (L4 load-balanced) and is fronted by a PodDisruptionBudget.</text>
  <text x="120" y="789" font-size="11" fill="#334155">• HPAs scale Order/Inventory/Gateway 3-10 pods on CPU/memory. Stock-deduction correctness under scale-out is guaranteed by DB row locks, not pod count.</text>
  <text x="120" y="806" font-size="11" fill="#334155">• Readiness/liveness probes on every pod; Resilience4j circuit breakers + retries protect against a slow/unhealthy downstream dependency.</text>

  <text x="650" y="855" text-anchor="middle" font-size="11" fill="#64748b">Data consistency: Order Service performs synchronous stock reservation against Inventory Service; on partial failure it issues compensating "release" calls (try-confirm/cancel pattern).</text>
</svg>
