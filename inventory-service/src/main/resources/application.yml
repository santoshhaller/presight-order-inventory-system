server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  cloud:
    kubernetes:
      config:
        enabled: false   # only meaningful inside a real cluster; see application-k8s.yml
      reload:
        enabled: false

# Default / local value. Overridden by the ConfigMap when running in Kubernetes,
# or by the LOW_STOCK_THRESHOLD env var in docker-compose.
inventory:
  low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.presight.inventory: INFO
