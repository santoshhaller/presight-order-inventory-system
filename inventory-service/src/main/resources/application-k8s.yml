spring:
  datasource:
    url: jdbc:mysql://mysql-inventory:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

  cloud:
    kubernetes:
      config:
        enabled: true
        sources:
          - name: inventory-threshold-config
        namespace: ${POD_NAMESPACE:presight}
      reload:
        enabled: true
        mode: event   # watch the ConfigMap via the K8s API and push a refresh event on change
        strategy: refresh

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true


management:
  health:
    kubernetes:
      enabled: false
